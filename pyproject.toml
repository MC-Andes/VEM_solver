[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-andes-vem3d"
version = "0.1.0"
description = "Homogenización elástica VEM 3D de primer orden sobre mallas poliédricas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pyamg>=5.4.1,<6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
vem3d-run = "vem3d.cli.single:main"
vem3d-batch-homogeneous = "vem3d.cli.batch_homogeneous:main"
vem3d-batch-heterogeneous = "vem3d.cli.batch_heterogeneous:main"

[tool.setuptools]
py-modules = ["vem3d_core"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=vem3d --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "work", ".venv*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741"]
